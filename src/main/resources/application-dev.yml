spring:
  datasource:
    url: jdbc:postgresql://localhost:${CASBYTES_COMPOSE_POSTGRES_PORT:5433}/casbytes_core_db?currentSchema=public
  data:
    redis:
      host: localhost
      port: ${CASBYTES_COMPOSE_REDIS_PORT:6380}

  kafka:
    bootstrap-servers: localhost:${CASBYTES_COMPOSE_KAFKA_HOST_PORT:9094}

  elasticsearch:
    uris: http://localhost:${CASBYTES_COMPOSE_ELASTICSEARCH_PORT:9201}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.casbytes.core: DEBUG
    org.hibernate.SQL: DEBUG

casbytes:
  jwt:
    secret: ${CASBYTES_JWT_SECRET:dev-casbytes-jwt-signing-key-minimum-48-characters-for-local-use-01}
  auth:
    bootstrap-admin-enabled: true
    admin-email: admin@casbytes.com
    admin-password-encoded: '{noop}Admin@bytes'
  security:
    permit-api-without-auth: true

management:
  endpoint:
    health:
      show-details: always
