# SonarQube / SonarCloud — run after tests with coverage:
#   ./mvnw verify && ./mvnw sonar:sonar \
#     -Dsonar.host.url=https://sonarcloud.io \
#     -Dsonar.login=$SONAR_TOKEN
#
# Override sonar.projectKey for your organization.

sonar.projectKey=casbytes-core-service
sonar.projectName=CasBytes Core Service

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
