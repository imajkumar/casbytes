spring:
  datasource:
    url: jdbc:postgresql://localhost:${CASBYTES_COMPOSE_POSTGRES_PORT:5433}/casbytes_core_db?currentSchema=public
    # Default local Postgres password (matches docker-compose default). Override: SPRING_DATASOURCE_PASSWORD.
    password: 'System$Admin'
  flyway:
    schemas: public
    default-schema: public
  data:
    redis:
      host: localhost
      port: ${CASBYTES_COMPOSE_REDIS_PORT:6380}

  kafka:
    bootstrap-servers: localhost:${CASBYTES_COMPOSE_KAFKA_HOST_PORT:9094}

  elasticsearch:
    uris: http://localhost:${CASBYTES_COMPOSE_ELASTICSEARCH_PORT:9201}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

logging:
  level:
    com.casbytes.core: DEBUG
    org.hibernate.SQL: DEBUG

casbytes:
  # Skip Kafka broker probe unless you run docker compose with Kafka (localhost:9094).
  health:
    kafka:
      enabled: ${CASBYTES_HEALTH_KAFKA_ENABLED:false}
  jwt:
    secret: ${CASBYTES_JWT_SECRET:dev-casbytes-jwt-signing-key-minimum-48-characters-for-local-use-01}
  # Root admin is seeded in DB (Flyway V3 + startup seeder). Optional YAML bootstrap for emergencies only.
  auth:
    bootstrap-admin-enabled: false
  security:
    permit-api-without-auth: true

management:
  endpoint:
    health:
      show-details: always
