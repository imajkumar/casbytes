spring:
  application:
    name: casbytes-core-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/casbytes_core_db?currentSchema=public
    username: ${CASBYTES_DATASOURCE_USERNAME:ayra}
    password: ${CASBYTES_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      pool-name: casbytes-core-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

  data:
    redis:
      host: ${CASBYTES_REDIS_HOST:localhost}
      port: ${CASBYTES_REDIS_PORT:6379}
      password: ${CASBYTES_REDIS_PASSWORD:}
      username: ${CASBYTES_REDIS_USERNAME:}
      ssl:
        enabled: ${CASBYTES_REDIS_SSL:false}

  kafka:
    bootstrap-servers: ${CASBYTES_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

  elasticsearch:
    uris: ${CASBYTES_ELASTICSEARCH_URIS:http://localhost:9201}
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  mail:
    host: ${CASBYTES_MAIL_HOST:localhost}
    port: ${CASBYTES_MAIL_PORT:1025}
    username: ${CASBYTES_MAIL_USERNAME:}
    password: ${CASBYTES_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${CASBYTES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${CASBYTES_MAIL_SMTP_STARTTLS:false}

server:
  port: ${CASBYTES_SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

management:
  server:
    port: ${CASBYTES_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

casbytes:
  security:
    permit-api-without-auth: false
    oauth2:
      enabled: ${CASBYTES_OAUTH2_ENABLED:false}
      issuer-uri: ${CASBYTES_OAUTH2_ISSUER_URI:}
      jwk-set-uri: ${CASBYTES_OAUTH2_JWK_SET_URI:}
      audiences:
        - ${CASBYTES_OAUTH2_AUDIENCE:casbytes-core}
      map-realm-roles: ${CASBYTES_OAUTH2_MAP_REALM_ROLES:false}
  auth:
    bootstrap-admin-enabled: ${CASBYTES_AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
    admin-email: ${CASBYTES_ADMIN_EMAIL:}
    admin-password-encoded: ${CASBYTES_ADMIN_PASSWORD_ENCODED:}
  health:
    kafka:
      enabled: true
  casbin:
    enabled: true
    policy-store: classpath
    reload-endpoint-enabled: ${CASBYTES_CASBIN_RELOAD_ENDPOINT_ENABLED:false}
    jdbc-table-name: casbin_rule
    jdbc-auto-create-table: false
    model-path: classpath:casbin/model.conf
    policy-path: classpath:casbin/policy.csv

  jwt:
    secret: ${CASBYTES_JWT_SECRET:}
    issuer: ${CASBYTES_JWT_ISSUER:casbytes-auth}
    audience: ${CASBYTES_JWT_AUDIENCE:casbytes-core}
    access-token-ttl-seconds: ${CASBYTES_JWT_ACCESS_TTL_SECONDS:900}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.casbytes.core: INFO
